<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonPassword</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <header>
    <img src="moon.svg" alt="" width="32" height="32">
    <div><h1>MoonPassword</h1><p id="site" hidden></p></div>
  </header>
  <main>
    <p id="status" role="status">正在识别当前页面…</p>
    <section id="logins" hidden aria-labelledby="login-title">
      <h2 id="login-title">填充已保存的账号</h2>
      <div id="accounts"></div>
    </section>
    <section id="signup" hidden aria-labelledby="signup-title">
      <h2 id="signup-title">为新密码字段生成密码</h2>
      <button id="generate-save" class="primary" type="button">生成、填充并保存</button>
      <button id="generate" type="button">只生成并填充</button>
    </section>
  </main>
  <footer>
    <button id="open" type="button">打开 Windows 版 MoonPassword</button>
    <p>当前网站的来源仅发送至本机 MoonPassword。填充已保存的密码或添加账号前，请在桌面端确认。</p>
  </footer>
</body>
</html>
