# Linux job mirrors `make check` minus the Android toolchain; the Android job builds the
# AAR and APKs on the runner's preinstalled SDK; the Windows job is the only place the
# real WPF app is built and the real clipbridge_core.dll is loaded by .NET on Windows.
name: ci

on:
  push:
    branches: [main, fix/silent-copy]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Non-interactive: wine's postinst can otherwise wait for input forever.
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wine wine64 keepassxc
        env:
          DEBIAN_FRONTEND: noninteractive
      - run: make vet test dll-smoke dll-wine test-interop build-windows-app cli

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu image already has the Android SDK (ANDROID_HOME); only add what we pin.
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: gomobile init
        working-directory: core
      # The `env` expression context cannot see the runner's ANDROID_HOME, so export in the shell.
      - run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          make apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build clipbridge_core.dll (cgo needs gcc; the runner image ships MinGW)
        shell: bash
        run: |
          mkdir -p core/dist/windows-amd64
          cd core
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o dist/windows-amd64/clipbridge_core.dll ./cmd/cbcore-dll
      - name: Go tests
        run: go test ./...
        working-directory: core
      - name: C# interop tests against the real DLL
        run: dotnet test windows/ClipBridge.Windows.Tests
      - name: Build WPF app
        run: dotnet build windows/ClipBridge.Windows -c Release
